[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plocust"
version = "0.0.1"
description = "LOCUST: build-independent locus passports for plant GWAS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "numpy", "pandas", "scipy", "pysam", "mappy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
plocust = "plocust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
