<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plocust workflow</title>
<style>
  :root {
    --bg: #fbfbf8;
    --ink: #1f2328;
    --ink-2: #57606a;
    --muted: #8c959f;
    --green: #3aa03c;
    --green-soft: #e9f5e3;
    --blue: #2a78d6;
    --blue-soft: #e6f0fc;
    --orange: #eb6834;
    --orange-soft: #fdeee6;
    --line: #d0d7de;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: "Inter", "Segoe UI", "Helvetica Neue", "DejaVu Sans", Arial, sans-serif; }
  svg text { font-family: inherit; }
</style>
</head>
<body>
<svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ------------------------------------------------------------------ content
const INPUTS = [
  { icon: "📄", title: "GWAS results table", sub: "PLINK2, GEMMA, GAPIT, REGENIE…", required: true },
  { icon: "🧬", title: "Genome FASTA", sub: "or SNP-chip marker sequences" },
  { icon: "🌾", title: "Genotypes", sub: "or the database's LD panel" },
  { icon: "🗂️", title: "Gene annotation", sub: "GFF3" },
];
const STEPS = [
  { icon: "🔎", title: "Detect genome", lines: ["which version are the", "positions on?"] },
  { icon: "📍", title: "Find loci", lines: ["peaks, credible set,", "LD block, haplotypes"] },
  { icon: "🧾", title: "Describe", lines: ["signal, regional imprint,", "nearby genes"] },
  { icon: "🔗", title: "DNA anchors", lines: ["201 bp sequences +", "stable ID from DNA"] },
  { icon: "🗺️", title: "Place anywhere", lines: ["align anchors to any", "genome or variety"] },
  { icon: "⚖️", title: "Compare & match", lines: ["LD · direction · coloc", "+ known genes"] },
];
const OUTPUTS = [
  { icon: "🪪", title: "Locus passports", sub: "one per locus (.jsonl)" },
  { icon: "🗺️", title: "Placements", sub: "on any genome or variety" },
  { icon: "⚖️", title: "Same or different?", sub: "across studies" },
  { icon: "🌾", title: "Known genes", sub: "trait matches first" },
  { icon: "🖼️", title: "Locus card", sub: "one figure for breeders" },
];

// ------------------------------------------------------------------ layout
const W = 1800, H = 960;
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("chart");
svg.setAttribute("width", W);
svg.setAttribute("height", H);
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function text(x, y, str, size, color, weight = 400, anchor = "middle", parent = svg) {
  const t = el("text", { x, y, "font-size": size, fill: color, "font-weight": weight, "text-anchor": anchor }, parent);
  t.textContent = str;
  return t;
}

// definitions: shadow, gradients, arrowheads
const defs = el("defs");
const shadow = el("filter", { id: "shadow", x: "-20%", y: "-20%", width: "140%", height: "160%" }, defs);
el("feDropShadow", { dx: 0, dy: 6, stdDeviation: 9, "flood-color": "#1f2328", "flood-opacity": 0.10 }, shadow);
function gradient(id, a, b) {
  const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": a }, g);
  el("stop", { offset: "100%", "stop-color": b }, g);
}
gradient("gStep", "#2a78d6", "#3aa03c");
gradient("gBand", "#ffffff", "#f4f6f1");
for (const [id, color] of [["arrow", css("--muted")], ["arrowBlue", css("--blue")]]) {
  const m = el("marker", { id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7,
                            orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", fill: color }, m);
}

// header: logo + title
el("image", { href: "../logo/plocust_icon.png", x: 60, y: 28, width: 96, height: 96 });
text(176, 78, "plocust", 46, css("--ink"), 800, "start");
text(178, 112, "from a GWAS table to a locus passport that works on any genome", 21, css("--ink-2"), 400, "start");

// three bands
const bands = [
  { y: 158, h: 168, label: "INPUT", color: css("--green"), soft: css("--green-soft") },
  { y: 372, h: 250, label: "HOW IT WORKS", color: css("--blue"), soft: css("--blue-soft") },
  { y: 668, h: 168, label: "OUTPUT", color: css("--orange"), soft: css("--orange-soft") },
];
for (const b of bands) {
  el("rect", { x: 40, y: b.y, width: W - 80, height: b.h, rx: 26, fill: "url(#gBand)", stroke: css("--line") });
  el("rect", { x: 40, y: b.y, width: 14, height: b.h, rx: 7, fill: b.color });
  const lbl = text(0, 0, b.label, 15, b.color, 800);
  lbl.setAttribute("transform", `translate(${86},${b.y + b.h / 2}) rotate(-90)`);
  lbl.setAttribute("letter-spacing", "3");
}

// cards
function card(cx, cy, w, h, item, accent, soft, opts = {}) {
  const g = el("g");
  el("rect", { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 18, fill: "#fff",
               stroke: opts.strong ? accent : css("--line"), "stroke-width": opts.strong ? 2.5 : 1.2,
               filter: "url(#shadow)" }, g);
  el("circle", { cx: cx - w / 2 + 40, cy, r: 25, fill: soft }, g);
  text(cx - w / 2 + 40, cy + 9, item.icon, 25, css("--ink"), 400, "middle", g);
  text(cx - w / 2 + 78, cy - 6, item.title, 20, css("--ink"), 700, "start", g);
  text(cx - w / 2 + 78, cy + 20, item.sub, 14.5, css("--ink-2"), 400, "start", g);
  if (opts.badge) {
    el("rect", { x: cx + w / 2 - 92, y: cy - h / 2 - 13, width: 82, height: 26, rx: 13, fill: accent }, g);
    text(cx + w / 2 - 51, cy - h / 2 + 5, opts.badge, 13, "#fff", 700, "middle", g);
  }
  return g;
}

const left = 130, right = W - 70;
function spread(n, y, w) {
  const gap = (right - left - n * w) / (n - 1);
  return Array.from({ length: n }, (_, i) => ({ x: left + w / 2 + i * (w + gap), y }));
}

const inPos = spread(INPUTS.length, bands[0].y + bands[0].h / 2, 360);
INPUTS.forEach((it, i) => card(inPos[i].x, inPos[i].y, 360, 92, it, css("--green"), css("--green-soft"),
                                { strong: it.required, badge: it.required ? "required" : "optional" }));

// steps: numbered gradient circles joined by arrows
const stepPos = spread(STEPS.length, bands[1].y + 104, 220);
stepPos.forEach((p, i) => {
  if (i < STEPS.length - 1) {
    const q = stepPos[i + 1];
    el("path", { d: `M${p.x + 64},${p.y} L${q.x - 70},${q.y}`, stroke: css("--blue"), "stroke-width": 3,
                 fill: "none", "marker-end": "url(#arrowBlue)", "stroke-dasharray": "0" });
  }
  el("circle", { cx: p.x, cy: p.y, r: 56, fill: "url(#gStep)", filter: "url(#shadow)" });
  el("circle", { cx: p.x, cy: p.y, r: 47, fill: "none", stroke: "#ffffff", "stroke-opacity": 0.45, "stroke-width": 2 });
  text(p.x, p.y + 13, STEPS[i].icon, 36, "#fff");
  el("circle", { cx: p.x + 42, cy: p.y - 42, r: 16, fill: css("--orange"), stroke: "#fff", "stroke-width": 3 });
  text(p.x + 42, p.y - 36, String(i + 1), 16, "#fff", 800);
  text(p.x, p.y + 88, STEPS[i].title, 20, css("--ink"), 700);
  STEPS[i].lines.forEach((l, k) => text(p.x, p.y + 114 + k * 20, l, 15, css("--ink-2")));
});

const outPos = spread(OUTPUTS.length, bands[2].y + bands[2].h / 2, 290);

// collector lines: inputs drop onto a line that feeds step 1; step 6 feeds a line that drops into each output
const blue = css("--blue"), grey = css("--muted");
function line(d, color, width = 2.5, arrow = false) {
  el("path", { d, stroke: color, "stroke-width": width, fill: "none", "stroke-linecap": "round",
               "stroke-linejoin": "round", ...(arrow ? { "marker-end": color === blue ? "url(#arrowBlue)" : "url(#arrow)" } : {}) });
}
const busIn = bands[0].y + bands[0].h + 23;          // between INPUT and HOW IT WORKS
inPos.forEach(p => line(`M${p.x},${bands[0].y + bands[0].h - 24} L${p.x},${busIn}`, grey));
line(`M${inPos[inPos.length - 1].x},${busIn} L${stepPos[0].x + 14},${busIn} Q${stepPos[0].x},${busIn} ${stepPos[0].x},${busIn + 14} L${stepPos[0].x},${stepPos[0].y - 64}`, grey, 2.5, true);
inPos.forEach(p => el("circle", { cx: p.x, cy: busIn, r: 5, fill: grey }));

const busOut = bands[2].y - 23;                       // between HOW IT WORKS and OUTPUT
const last = stepPos[stepPos.length - 1];
line(`M${last.x},${last.y + 150} L${last.x},${busOut - 14} Q${last.x},${busOut} ${last.x - 14},${busOut} L${left + 145},${busOut}`, blue, 2.5);
outPos.forEach(p => {
  el("circle", { cx: p.x, cy: busOut, r: 5, fill: blue });
  line(`M${p.x},${busOut} L${p.x},${bands[2].y + bands[2].h / 2 - 52}`, blue, 2.5, true);
});

outPos.forEach((p, i) => card(p.x, p.y, 290, 92, OUTPUTS[i], css("--orange"), css("--orange-soft")));

// footer
text(W / 2, H - 52, "Minimum input: the GWAS results table alone. plocust detects the genome version, finds the DNA,",
     17, css("--ink-2"));
text(W / 2, H - 28, "and uses its database for chip-marker sequences and a reference LD panel.", 17, css("--ink-2"));
</script>
</body>
</html>
